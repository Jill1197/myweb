networks:
  mynetwork:
    driver: bridge

services:
  redis:
    image: redis:7
    container_name: myweb-redis
    networks:
      - mynetwork

  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/usr/src/app:cached
      - /usr/src/app/node_modules
      - ./database.sqlite:/usr/src/app/database.sqlite
      - ./public:/usr/src/app/public
      - ./access.log:/usr/src/app/access.log
      - ./essential-access.log:/usr/src/app/essential-access.log
    environment:
      NODE_ENV: development
    networks:
      - mynetwork

  caddy:
    image: caddy:2
    # ports:
    #  - "80:80"
    #  - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - mynetwork

  # === เพิ่มตัวนี้เข้าไปข้างล่างสุดครับ ===
  tunnel:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token eyJhIjoiOGEyMTc3Yjg3ZGM1NWNkMDJhNWM4NWRmNTk4ODNkODEiLCJ0IjoiNmE5Y2RlMDMtNDU4MC00NjcxLTk0YWYtMzljNzk3M2ZmMGJkIiwicyI6IlpXTmlPVGRsTm1NdE4ySmtOUzAwTkdSaExUbGlPVEF0TURNeU1qTTRNak0zTnpFdyJ9
    networks:
      - mynetwork

volumes:
  caddy_data:
  caddy_config: